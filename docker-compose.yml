# docker compose up -d --build
#   Web:     http://localhost:5090
#   API:     http://localhost:5089/swagger
#   Postgres: localhost:5432 (concancha / concancha)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: concancha
      POSTGRES_USER: concancha
      POSTGRES_PASSWORD: concancha
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concancha -d concancha"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        PROJECT: ConCancha.Api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=concancha;Username=concancha;Password=concancha
      Jwt__Key: clave-solo-para-desarrollo-local-no-usar-en-produccion-0123456789
      Database__MigrateOnStartup: "true"
      Auth__CheckLeakedPasswords: "false"
      Web__BaseUrl: http://localhost:5090
    ports:
      - "5089:8080"

  web:
    build:
      context: .
      args:
        PROJECT: ConCancha.Web
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseUrl: http://api:8080
    ports:
      - "5090:8080"

volumes:
  db-data:
