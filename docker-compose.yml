services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: concancha
      POSTGRES_USER: concancha
      POSTGRES_PASSWORD: concancha
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concancha -d concancha"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
