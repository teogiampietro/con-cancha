<script>
/* ============ utilidades ============ */
const LS='maqueta-canchas-v1';
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'],DIASF=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const $=s=>document.querySelector(s);

  S.wiz=null;ui.ccTab='canchas';ui.werr='';save();location.hash='#/panel/inicio';render();window.scrollTo(0,0);toast('¡Listo! Armamos tus canchas y precios')}

const bookingAt=(courtId,date,start,end)=>S.bookings.find(b=>b.courtId===courtId&&b.date===date&&b.estado!=='cancelada'&&b.start<end&&start<b.end);
function addBooking(o){const b={id:S.seq++,estado:'confirmada',tipo:'reserva',pagado:false,metodo:null,sena:0,busco:null,origen:'club',...o};S.bookings.push(b);save();return b}
const entro=b=>b.tipo==='bloqueo'||b.estado==='cancelada'?0:b.pagado?b.precio:(b.sena||0);
const debe=b=>b.tipo==='bloqueo'||b.estado==='cancelada'||b.estado==='noshow'?0:Math.max(0,b.precio-entro(b));
const dayBookings=d=>S.bookings.filter(b=>b.date===d&&b.estado!=='cancelada');
const freeSlots=d=>{const a=[];for(const c of activeCourts())for(const s of slotsFor(c)){if(!isPast(d,s)&&!bookingAt(c.id,d,s,s+c.dur))a.push({c,s,price:priceFor(c.id,d,s)})}return a};
function dayStats(d){let tot=0,occ=0,esc=0;for(const c of activeCourts())for(const s of slotsFor(c)){tot++;const b=bookingAt(c.id,d,s,s+c.dur);if(b)occ++;else if(isPast(d,s))esc+=priceFor(c.id,d,s)}
  const bs=dayBookings(d);return{tot,occ,pct:tot?Math.round(occ*100/tot):0,entro:bs.reduce((a,b)=>a+entro(b),0),escapa:esc,falta:bs.reduce((a,b)=>a+debe(b),0)}}
function cancelBooking(id,motivo){const b=S.bookings.find(x=>x.id===id);if(!b)return;b.estado='cancelada';b.cancelado=motivo||'club';
  S.payments.filter(p=>p.bookingId===id&&p.estado==='pendiente').forEach(p=>p.estado='rechazado');
  S.waitlist.filter(w=>w.estado==='esperando'&&w.courtId===b.courtId&&w.date===b.date&&w.start===b.start).forEach(w=>{w.estado='avisado'});save()}
function bookingChip(b){if(b.tipo==='bloqueo')return'<span class="chip">Bloqueado</span>';
  const e={confirmada:b.pagado?'<span class="chip ok">Pagó</span>':b.sena?'<span class="chip warn">Seña '+money(b.sena)+'</span>':'<span class="chip warn">Debe</span>',pendiente_sena:'<span class="chip warn">Esperando seña</span>',jugada:'<span class="chip ok">Jugada</span>',noshow:'<span class="chip bad">No vino</span>',cancelada:'<span class="chip bad">Cancelada</span>'};return e[b.estado]||''}
const clients=()=>{const m={};for(const b of S.bookings){if(b.tipo==='bloqueo')continue;const k=b.tel||b.nombre;const c=m[k]=m[k]||{nombre:b.nombre,tel:b.tel,n:0,gasto:0,deuda:0,faltas:0};
  if(b.estado==='cancelada')continue;if(b.estado==='noshow')c.faltas++;else c.n++;c.gasto+=entro(b);c.deuda+=debe(b)}return Object.values(m)};

    else if(S.session.role!=='owner'){location.hash='#/panel/login';return}

    else if(b==='empezar'){location.hash='#/panel/inicio';return}
    else{const key='#/panel/'+(b||'agenda');const fn=PANELS[b||'agenda'];html=shellPanel(key,fn?fn():'<div class="empty">No existe esta sección</div>')}}
  else html=landing();
  const act=document.activeElement,fid=act&&act.id,pos=act&&act.selectionStart;
  $('#app').innerHTML=html;
  document.body.classList.toggle('has-bnav',html.includes('class="bnav"'));

  if(fid){const e=document.getElementById(fid);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}
}

    h+=`<div class="ctabs">${courts.map(x=>`<button class="ctab ${x.id===ui.ccourt?'on':''}" data-act="ccourt" data-id="${x.id}">${esc(x.nombre)}</button>`).join('')}</div><div class="col mt" style="gap:10px">`;
    if(!ct)h+='<div class="empty">El club todavía no cargó canchas.</div>';
    else for(const s of slotsFor(ct)){const end=s+ct.dur,past=isPast(d,s),bk=bookingAt(ct.id,d,s,end),pr=priceFor(ct.id,d,s);
      const mine=bk&&bk.tipo==='reserva'&&myBookings().some(m=>m.id===bk.id);
      let cls='cslot',inner,att='',free=false;
      if(past){cls+=' past';inner=`<b class="mut" style="font-size:18px">Pasó</b><span class="sm mut">${ct.dur} min</span>`}
      else if(!bk){free=true;cls+=' libre';att=`data-act="reserve" data-court="${ct.id}" data-start="${s}"`;inner=`<div><div class="bb">LIBRE</div><div class="sm mut" style="margin-top:4px">Tocá para reservar</div></div><span class="pr">${money(pr)}</span>`}
      else if(bk.tipo==='bloqueo'){cls+=' block';inner=`<b>No disponible</b>`}
      else{cls+=bk.estado==='pendiente_sena'?' pend':' busy';if(mine)cls+=' mine';att=mine?'':`data-act="waitlist" data-court="${ct.id}" data-start="${s}"`;inner=`<div><b>${mine?'Tu turno':'Ocupado'}</b>${mine?'':'<div class="sm">Tocá para anotarte en la lista de espera</div>'}</div><span class="sm">${bk.estado==='pendiente_sena'?'Reserva en curso':''}</span>`}
      h+=`<div class="cs"><span class="ct ${free?'fr':''}">${hhmm(s)}</span><button class="${cls}" ${att}>${inner}</button></div>`}
    h+=`</div>`;
    const mb=myBookings();
    if(mb.length)h+=`<h2>Tus turnos en ${esc(c.name)}</h2><div class="col">${mb.map(b=>`<div class="card"><div class="row sp"><div><b>${shortDate(b.date)} · ${hhmm(b.start)}</b><div class="sm mut">${esc(court(b.courtId).nombre)}</div></div>${bookingChip(b)}</div><div class="acts mt"><button class="btn danger sm" data-act="cancelMine" data-id="${b.id}">Cancelar</button>${b.estado==='pendiente_sena'?`<button class="btn sm" data-act="sena" data-id="${b.id}">Enviar seña</button>`:''}</div></div>`).join('')}</div>`;
    const busq=S.bookings.filter(b=>b.busco&&b.estado==='confirmada'&&(b.date>today()||(b.date===today()&&b.start>nowMin())));
    if(busq.length)h+=`<h2>Buscan jugadores</h2><div class="col">${busq.map(b=>`<div class="card"><div class="row sp wrap"><div><b>${shortDate(b.date)} · ${hhmm(b.start)} · ${esc(court(b.courtId).nombre)}</b><div class="sm mut">Faltan ${b.busco.cupo} · categoría ${esc(b.busco.cat||'libre')}</div></div>${b.userId===S.player.id&&S.session.role==='player'?'<span class="chip">Tuyo</span>':`<button class="btn sm" data-act="sumarse" data-id="${b.id}">Pedir sumarme</button>`}</div></div>`).join('')}</div>`;
    if(c.phone)h+=`<p class="center mut sm mt"><a href="tel:${esc(c.phone)}" class="btn sec" style="border-radius:99px">¿Preferís llamar? <b>${esc(c.phone)}</b></a></p>`;
  }
  h+=`<p class="center mut xs mt">Con tecnología de <b>Reserva de canchas</b> · <a href="#" data-act="demoOpen" onclick="return false">demo</a></p></div>`;return h}
function clubChat(){const sugs=['¿Qué hay libre hoy a la noche?','¿Tenés algo el sábado?','¿Cuánto sale?'];
  const msgs=[{me:false,t:`¡Hola! Decime qué día y a qué hora querés jugar en ${S.club.name} y te busco cancha.`},...ui.chat];
  return `<div class="chatcard"><div class="chat">${msgs.map(m=>`<div class="msg ${m.me?'me':''}">${esc(m.t)}</div>`).join('')}</div><div class="sugs">${sugs.map(x=>`<button class="btn sec sm" style="border-radius:99px;font-weight:500" data-act="ask" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>
  <form class="row mt" data-form="ask"><input name="q" placeholder="Escribí lo que necesitás…" autocomplete="off"><button class="btn" aria-label="Enviar">${ico('send')}</button></form><p class="mut sm center mt" style="margin-bottom:0">Asistente automático (simulado). Puede equivocarse: lo que vale es lo que queda registrado.</p></div>`}
function parseDay(txt){const t=txt.toLowerCase();if(/hoy/.test(t))return today();if(/mañana|manana/.test(t))return addDays(today(),1);for(let i=0;i<7;i++){if(t.includes(DIASF[i].normalize('NFD').replace(/[̀-ͯ]/g,''))||t.includes(DIASF[i])){const n=(i-dow(today())+7)%7;return addDays(today(),n||7)}}return null}
function answerClub(q){const t=q.toLowerCase();
  if(/cu[aá]nto|precio|sale/.test(t)){return 'Depende la cancha: '+activeCourts().map(c=>`${c.nombre} sale ${money(Math.min(...slotsFor(c).map(s=>priceFor(c.id,today(),s))))} (${c.dur} min)`).join(', ')+'. ¿Para cuál y qué día te interesa?'}
  const d=parseDay(t)||today();let fs=freeSlots(d);if(/noche/.test(t))fs=fs.filter(x=>x.s>=1080);if(/tarde/.test(t))fs=fs.filter(x=>x.s>=780&&x.s<1080);
  if(!fs.length)return `No encontré turnos libres ${dayLabel(d)||longDate(d)}. Probá con otro día o anotate en la lista de espera.`;
  return `Libre ${dayLabel(d).toLowerCase()||longDate(d)}:\n`+fs.slice(0,8).map(x=>`• ${hhmm(x.s)} ${x.c.nombre} · ${money(x.price)}`).join('\n')+'\nTocá “Ver horarios” para reservar.'}

function playerBookingCard(b){const hrs=((parse(b.date).getTime()+b.start*60000)-(parse(today()).getTime()+nowMin()*60000))/3600000;const can=hrs>=S.club.cancelHoras;

function playerReservar(){const has=S.bookings.some(b=>b.userId===S.player.id);return `<h1>Reservar</h1>`+(has?`<div class="col mt"><a class="card link" href="#/c/${S.club.slug}" style="text-decoration:none"><b>${esc(S.club.name)}</b><div class="sm mut">/${S.club.slug}</div></a></div>`:`<div class="card sec mt"><h3 class="sh" style="font-size:17px">Todavía no estás en ningún club</h3><p class="mut sm">Para reservar, entrá al link que te pasó tu club (termina en /nombredelclub) y reservá desde ahí. Después vas a poder verlo y volver a reservar desde acá.</p><a class="btn sec sm" href="#/c/${S.club.slug}">Abrir ${esc(S.club.name)} (demo)</a></div>`)}

const PANELS={};
function pageHead(t,sub,right=''){return `<div class="row sp wrap" style="margin-bottom:14px"><div><h1>${t}</h1>${sub?`<p class="mut" style="margin:0">${sub}</p>`:''}</div>${right}</div>`}
function dateNav(key,d){return `<div class="row"><button class="btn sec" data-act="pdate" data-k="${key}" data-d="${addDays(d,-1)}">‹</button><div class="center" style="min-width:150px"><b>${longDate(d)}</b><div class="sm" style="color:var(--acc)">${dayLabel(d)}</div></div><button class="btn sec" data-act="pdate" data-k="${key}" data-d="${addDays(d,1)}">›</button></div>`}
PANELS.inicio=()=>{const c=S.club;const steps=[['Cargá tus canchas',S.courts.length>0,'#/panel/canchas'],['Definí los precios por horario',S.pricing.length>0,'#/panel/canchas'],['Cargá tu primer turno',S.bookings.some(b=>b.tipo==='reserva'),'#/panel/agenda'],['Activá la seña por transferencia',c.senaOn&&!!c.alias,'#/panel/config'],['Compartí el link con tus jugadores',!!S.sharedOnce,'']];
  const G=[['PARA ARRANCAR',[['rocket','Tu primer día','Pasar el cuaderno a la agenda y mandarle el link a tus jugadores.']]],['HOY',[['cal','Agenda','Cargar un turno, marcar quién pagó, cancelar y bloquear un horario.'],['list','Reservas','Buscar la reserva de alguien y ver a quién le falta cobrar.'],['bell','Recordar turnos','Avisarle por WhatsApp a cada uno el día antes, con un toque.'],['wallet','Caja','Lo que entró en el día, en efectivo y en transferencia, y el cierre.'],['box','Buffet','Anotar lo que vendés en el buffet o el kiosco.'],['hour','Lista de espera','Quién quiere un horario lleno, y avisarle cuando se libera.']]],['EL CLUB',[['grid','Canchas','Tus canchas, los precios por horario y los turnos fijos.'],['users','Clientes','Todos los que reservaron: cuántas veces vinieron, cuánto gastaron y cuánto deben.'],['receipt','Señas','Aprobar o rechazar el comprobante que sube un jugador.']]],['CRECER',[['dash','Resumen','Lo que espera una decisión tuya y la plata que se está escapando esta semana.'],['chart','Métricas','Cuánta plata entró y cuánta se escapó en huecos.'],['trophy','Torneos','Armar zonas, partidos y horarios de un torneo.'],['gift','Premios','Puntos por jugar y premios para canjear.']]],['TU CUENTA',[['sparkles','Asistente','Preguntale cómo viene el día o pedile que cargue un turno, como a un empleado.'],['gear','Configuración','Tu marca, tu país, la seña, la cancelación y tu cuenta.'],['userplus','Equipo','Sumar a quien te ayuda en el mostrador, sin que vea tu plan.'],['card','Mi plan','Qué plan tenés y hasta cuándo.']]]];
  return pageHead('Bienvenido a '+esc(c.name),'Mirá este video primero. Abajo tenés uno cortito por cada parte del panel, por si te queda alguna duda.')+`<div class="card col"><b>Primeros pasos</b>${steps.map(s=>`<div class="row"><span class="chip ${s[1]?'ok':'warn'}">${s[1]?'✓':'•'}</span><span class="grow">${s[0]}</span>${s[2]?`<a class="btn sec sm" href="${s[2]}">Ir</a>`:`<button class="btn sec sm" data-act="share">Copiar link</button>`}</div>`).join('')}</div>`+G.map(g=>`<div class="gh">${g[0]}</div>${g[1].map(x=>`<div class="card gcard" data-act="video"><div class="gico">${ico(x[0])}</div><div class="grow"><b>${x[1]}</b><div class="sm mut">${x[2]}</div></div>${ico('play')}</div>`).join('')}`).join('')};
PANELS.agenda=()=>{const d=ui.pdate,st=dayStats(d),courts=activeCourts();if(!courts.length)return pageHead('Agenda','Acá vas a ver los turnos de cada cancha, hora por hora.')+'<div class="empty"><b>Todavía no cargaste canchas</b>Primero agregá tus canchas y sus precios; después podés cargar turnos.<div class="mt"><a class="btn" href="#/panel/canchas">Cargar mi primera cancha</a></div></div>';const K=1.2,PAD=10,G0=gridStart(),H=(1440-G0)*K+PAD*2;
  const days=Array.from({length:7},(_,i)=>addDays(today(),i));
  const axis=Array.from({length:(1440-G0)/60+1},(_,i)=>i+G0/60).map(h=>`<span style="top:${PAD+(h*60-G0)*K}px">${String(h).padStart(2,'0')}:00</span>`).join('');
  const cols=courts.map(c=>{let cards='';for(const s of slotsFor(c)){const end=s+c.dur,bk=bookingAt(c.id,d,s,end),past=isPast(d,s);const pos=`style="top:${PAD+(s-G0)*K+2}px;height:${c.dur*K-4}px"`,pr=priceFor(c.id,d,s);
      if(!bk)cards+=past?`<button class="tc past" ${pos} data-act="slot" data-court="${c.id}" data-start="${s}"><span>${hhmm(s)} · ${money(pr)}</span></button>`:`<button class="tc free" ${pos} data-act="slot" data-court="${c.id}" data-start="${s}"><div class="row sp"><b>${hhmm(s)}</b><b>＋</b></div><div><div class="tcp">${money(pr)}</div><div class="sm mut">Libre</div></div></button>`;
      else if(bk.tipo==='bloqueo')cards+=`<button class="tc blk" ${pos} data-act="booking" data-id="${bk.id}"><b>${hhmm(s)}</b><span>🔒 ${esc(bk.motivo||'Bloqueado')}</span></button>`;
      else cards+=`<button class="tc bkc ${bk.estado==='pendiente_sena'?'pend':''}" ${pos} data-act="booking" data-id="${bk.id}"><div class="row sp"><span class="sm mut">${hhmm(s)}</span>${bookingChip(bk)}</div><div><b>${esc(bk.nombre)}</b>${bk.fijoId?' <span class="chip">fijo</span>':''}${bk.busco?' 🔎':''}<div class="sm mut">${money(bk.precio)}</div></div></button>`}
    const nl=d===today()?`<div class="nowline" style="top:${PAD+(nowMin()-G0)*K}px"></div>`:'';
    return `<div class="tg-col" style="height:${H}px">${nl}${cards}</div>`}).join('');
  return `<div class="row wrap" style="gap:10px">${dateNav('pdate',d)}<button class="btn sec" data-act="share" title="Compartir link" aria-label="Compartir link">${ico('share')}</button></div>

PANELS.resumen=()=>{const t=today(),st=dayStats(t);let esc7=0;const bars=[];for(let i=0;i<7;i++){const d=addDays(t,i),s=dayStats(d);for(const c of activeCourts())for(const sl of slotsFor(c)){if(!isPast(d,sl)&&!bookingAt(c.id,d,sl,sl+c.dur))esc7+=priceFor(c.id,d,sl)}bars.push([d,s.pct])}
  const pend=S.payments.filter(p=>p.estado==='pendiente').length,wl=S.waitlist.filter(w=>w.estado==='esperando').length,cobrar=S.bookings.filter(b=>b.date<=t&&debe(b)>0).length;const jug=S.bookings.filter(b=>b.date===t&&b.estado==='jugada').length;
  return pageHead('Resumen',esc(S.club.name))+`<div class="redcard"><div class="eyebrow red">Se puede escapar en los próximos 7 días</div><div class="big red">${money(esc7)}</div><p class="mut" style="margin:0">Es lo que valen los turnos que todavía están libres. Cada hora que pasa sin venderse, esa plata no vuelve.</p></div>
  <div class="stats2 mt"><div class="stat"><span class="xs">Ocupación hoy</span><b>${st.pct}%</b></div><div class="stat"><span class="xs">Entró hoy</span><b>${money(st.entro)}</b></div><div class="stat"><span class="xs">Falta cobrar</span><b>${money(st.falta)}</b></div><div class="stat"><span class="xs">Turnos jugados</span><b>${jug}</b></div></div>
  ${pend+wl+cobrar?`<div class="gh">ESPERA UNA DECISIÓN TUYA</div><div class="col">${pend?`<a class="card" href="#/panel/senas">${pend} seña(s) por validar</a>`:''}${wl?`<a class="card" href="#/panel/espera">${wl} persona(s) en lista de espera</a>`:''}${cobrar?`<a class="card" href="#/panel/reservas">${cobrar} turno(s) con plata por cobrar</a>`:''}</div>`:''}
  <div class="gh">LOS PRÓXIMOS 7 DÍAS</div><div class="card"><div class="vbars">${bars.map(([d,p])=>`<div class="vb"><span class="sm mut">${p}%</span><div class="vtrack"><i style="height:${p}%"></i></div><span class="sm mut">${d===t?'Hoy':DIAS[dow(d)][0].toUpperCase()+DIAS[dow(d)].slice(1)}</span></div>`).join('')}</div><p class="sm mut" style="margin:12px 0 0">La barra es lo vendido. Lo que falta para llegar arriba es lo que todavía se puede vender: ${money(esc7)} en total.</p></div>`};
PANELS.metricas=()=>{const n={dia:1,semana:7,mes:30,año:365}[ui.met];const t=today();const dates=[];for(let i=0;i<n;i++)dates.push(addDays(t,-i));
  let escapo=0,cobrado=0,porcobrar=0,jugados=0,tot=0,occ=0;const byH={},byC={};for(const c of S.courts)byC[c.id]={n:0,tot:0,m:0};
  for(const d of dates)for(const c of activeCourts())for(const s of slotsFor(c)){if(!isPast(d,s))continue;const bk=bookingAt(c.id,d,s,s+c.dur);tot++;byH[s]=byH[s]||{o:0,t:0};byH[s].t++;byC[c.id].tot++;if(bk&&bk.estado!=='noshow'&&bk.tipo==='reserva'){occ++;byH[s].o++;byC[c.id].n++;byC[c.id].m+=entro(bk)}else if(!bk)escapo+=priceFor(c.id,d,s)}
  for(const d of dates)for(const b of dayBookings(d)){if(b.tipo!=='reserva')continue;cobrado+=entro(b);porcobrar+=debe(b);if(b.estado==='jugada')jugados++}
  const hs=Object.keys(byH).map(Number).sort((a,b)=>a-b);
  return pageHead('Métricas','')+`<div class="seg">${['dia','semana','mes','año'].map(x=>`<button class="${ui.met===x?'on':''}" data-act="met" data-v="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>
  <div class="redcard mt"><div class="eyebrow red">Se escapó en huecos vacíos</div><div class="big">${money(escapo)}</div><p class="mut sm" style="margin:0">Plata que no entró por turnos que quedaron libres y ya pasaron.</p></div>
  <div class="stats2 mt"><div class="stat"><span class="xs">Cobrado</span><b>${money(cobrado)}</b></div><div class="stat"><span class="xs">Por cobrar</span><b class="amber">${money(porcobrar)}</b></div><div class="stat"><span class="xs">Turnos jugados</span><b>${jugados}</b></div><div class="stat"><span class="xs">Ocupación</span><b>${tot?Math.round(occ*100/tot):0}%</b></div></div>
  <div class="card sec mt"><h3 class="sh" style="font-size:14px;letter-spacing:.06em;text-transform:uppercase">Ocupación por horario</h3>${hs.map(s=>{const p=Math.round(byH[s].o*100/byH[s].t);return `<div class="bars"><span>${hhmm(s)}</span><div class="bar ${p<30?'low':''}"><i style="width:${p}%"></i></div><span>${p}%</span></div>`}).join('')||'<span class="mut">Sin datos</span>'}<p class="sm mut">Barras cortas y en rojo = horarios que se te están escapando.</p></div>
  <div class="gh">POR CANCHA</div><div class="col">${S.courts.map(c=>`<div class="card row sp"><b>${esc(c.nombre)}</b><span class="mut sm">${byC[c.id].n} turnos · ${byC[c.id].tot?Math.round(byC[c.id].n*100/byC[c.id].tot):0}% · ${money(byC[c.id].m)}</span></div>`).join('')}</div><p class="sm mut mt">Las métricas salen solas de los turnos que cargás. No hay que anotar nada aparte.</p>`};
PANELS.torneos=()=>pageHead('Torneos','Armá tus torneos y anotá a los que juegan.','<button class="btn" data-act="torNew">+ Nuevo</button>')+`<div class="col">${S.tournaments.map(t=>`<div class="card"><div class="row sp wrap"><div><b>${esc(t.nombre)}</b> <span class="chip">${esc(t.estado)}</span><div class="sm mut">${esc(t.deporte)}${t.formato?' · '+esc(t.formato):''} · ${shortDate(t.desde||t.fecha)}${t.hasta?' al '+shortDate(t.hasta):''} · inscripción ${t.precio?money(t.precio):'gratis'} · ${t.entries.length}${t.cupo?'/'+t.cupo:''}</div></div><div class="acts"><button class="btn sec sm" data-act="torAdd" data-id="${t.id}">+ Anotar</button><button class="btn sec sm" data-act="torEstado" data-id="${t.id}">${t.estado==='abierto'?'Cerrar inscripción':t.estado==='cerrado'?'Marcar finalizado':'Reabrir'}</button><button class="btn dng sm" data-act="torDel" data-id="${t.id}">Borrar</button></div></div>${t.entries.length?`<table class="tbl"><tbody>${t.entries.map(e=>`<tr><td>${esc(e.nombre)}</td><td><button class="chip ${e.pagado?'ok':'warn'}" style="cursor:pointer" data-act="torPago" data-t="${t.id}" data-e="${e.id}">${e.pagado?'pagó':'debe'}</button></td><td style="text-align:right"><button class="btn dng sm" data-act="torQuit" data-t="${t.id}" data-e="${e.id}">✕</button></td></tr>`).join('')}</tbody></table>`:''}</div>`).join('')||'<div class="empty"><b>Todavía no creaste ningún torneo</b></div>'}</div><p class="mut sm mt">Pendiente para la versión real: generación automática de zonas, partidos y horarios.</p>`;
PANELS.premios=()=>pageHead('Premios','Definí los premios que los jugadores canjean por puntos.')+`<form class="card sec" data-form="puntos"><h3 class="sh" style="font-size:15px;color:var(--mut)">Cómo se ganan los puntos</h3><label class="chk"><input type="checkbox" name="puntos" ${S.club.puntos?'checked':''}>Mi club da puntos</label><label class="f">Puntos por turno jugado</label><input name="pts" type="number" min="1" value="${S.club.ptsPorTurno}"><button class="btn fw mt">Guardar regla</button><p class="sm mut mt" style="margin-bottom:0">Los puntos se suman cuando marcás el turno como <b>jugado</b> en la agenda, y sólo si el jugador reservó con su cuenta.</p></form>
  <div class="gh">CANJES PENDIENTES</div>${S.redemptions.filter(r=>r.estado==='pendiente').map(r=>`<div class="card row sp" style="margin-bottom:8px"><div><b>${esc(r.nombre)}</b><div class="sm mut">${esc(S.player.nombre)}</div></div><button class="btn sm" data-act="entregar" data-id="${r.id}">Marcar entregado</button></div>`).join('')||'<p class="mut">No hay canjes pendientes.</p>'}
  <div class="row sp"><div class="gh" style="margin:22px 0 8px">MIS PREMIOS</div><button class="btn sm" data-act="rewEdit">+ Nuevo</button></div><div class="col">${S.rewards.map(r=>`<div class="card row sp wrap"><div><b>${esc(r.nombre)}</b> ${r.activo?'':'<span class="chip">inactivo</span>'}<div class="sm mut">${esc(r.desc||'')}${r.desc?' · ':''}${r.puntos} puntos${r.stock!==''&&r.stock!=null?' · stock '+r.stock:''}</div></div><div class="acts"><button class="btn sec sm" data-act="rewEdit" data-id="${r.id}">Editar</button><button class="btn dng sm" data-act="rewDel" data-id="${r.id}">Borrar</button></div></div>`).join('')||'<p class="mut">Todavía no cargaste premios.</p>'}</div>`;
PANELS.ia=()=>{const msgs=[{me:false,t:`Hola. Tengo a la vista la agenda de ${S.club.name} de los próximos 4 días. ¿Qué necesitás?`},...ui.aichat];
  return pageHead('Asistente','Preguntale por el día o pedile que cargue un turno, como si le hablaras a un empleado.')+`<div class="chatcard"><div class="chat">${msgs.map(m=>`<div class="msg ${m.me?'me':''}">${esc(m.t)}</div>`).join('')}</div><div class="sugs">${['¿Cómo viene hoy?','¿Qué me queda libre esta noche?','¿A quién le tengo que cobrar?','Anotá a Martín el sábado a las 20'].map(x=>`<button class="btn sec sm" style="border-radius:99px;font-weight:500" data-act="aask" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div><form class="row mt" data-form="aask"><input name="q" placeholder="Escribí lo que necesitás…" autocomplete="off"><button class="btn" aria-label="Enviar">${ico('send')}</button></form><p class="mut xs mt" style="text-transform:none;letter-spacing:0">Asistente automático (simulado en la maqueta). Puede equivocarse: lo que vale es lo que queda registrado.</p></div>`};
function answerOwner(q){const t=q.toLowerCase();const st=dayStats(today());
  if(/c[oó]mo viene/.test(t))return `Hoy: ocupación ${st.pct}%, entró ${money(st.entro)}, falta cobrar ${money(st.falta)}. Se escapó ${money(st.escapa)} en huecos que ya pasaron.`;
  if(/libre/.test(t)){let fs=freeSlots(today());if(/noche/.test(t))fs=fs.filter(x=>x.s>=1080);return fs.length?'Libre:\n'+fs.slice(0,10).map(x=>`• ${hhmm(x.s)} ${x.c.nombre} · ${money(x.price)}`).join('\n'):'No queda nada libre.'}
  if(/cobrar|debe/.test(t)){const l=clients().filter(c=>c.deuda>0);return l.length?'Te deben:\n'+l.map(c=>`• ${c.nombre}: ${money(c.deuda)}`).join('\n'):'Nadie te debe nada.'}
  const m=t.match(/an[oó]t[aá] a ([a-záéíóúñ ]+?) (?:el |para el |este |hoy|mañana)/i);
  if(m){const d=parseDay(t)||today();const hm=t.match(/(\d{1,2})(?::(\d{2}))?\s*(?:hs|h)?\s*$/)||t.match(/a las (\d{1,2})(?::(\d{2}))?/);if(!hm)return 'Decime a qué hora.';const st=(+hm[1])*60+(+hm[2]||0);
   const c=activeCourts().find(c=>slotsFor(c).includes(st)&&!bookingAt(c.id,d,st,st+c.dur));if(!c)return `No hay cancha libre a las ${hhmm(st)} ese día.`;const nombre=m[1].trim().replace(/\b\w/g,x=>x.toUpperCase());
   addBooking({courtId:c.id,date:d,start:st,end:st+c.dur,nombre,precio:priceFor(c.id,d,st)});return `Listo: anoté a ${nombre} en ${c.nombre} ${dayLabel(d).toLowerCase()||longDate(d)} a las ${hhmm(st)} (${money(priceFor(c.id,d,st))}). Lo ves en la agenda.`}
  return 'Puedo decirte cómo viene el día, qué queda libre, a quién cobrarle, o anotar un turno ("Anotá a Martín el sábado a las 20").'}
PANELS.config=()=>{const c=S.club,t=ui.cfgTab;let h=pageHead('Configuración','Cómo te ven tus clientes y cómo cobrás.')+`<div class="seg" style="max-width:520px">${[['marca','Marca'],['cobros','Cobros'],['cancel','Cancelación'],['cuenta','Tu cuenta']].map(x=>`<button class="${t===x[0]?'on':''}" data-act="cfgtab" data-v="${x[0]}">${x[1]}</button>`).join('')}</div><div class="mt" style="max-width:560px">`;
  if(t==='marca')h+=`<form class="card sec" data-form="marca"><h3 class="sh">Marca del club</h3><p class="mut sm">Así te ven tus clientes en el link de reservas.</p><div class="sub row" style="margin:0 0 12px;background:#070707"><div class="logoph">logo</div><div><div class="club-title" style="text-align:left;font-size:28px">${esc(c.name)}</div><span class="chip" style="color:${c.color};border-color:${c.color};margin-top:6px">Libre · así grita un hueco</span></div></div><label class="f">Nombre del club</label><input name="name" value="${esc(c.name)}"><label class="f">Teléfono del club (lo ven los jugadores)</label><input name="phone" value="${esc(c.phone)}"><label class="f">Logo (PNG/JPG, máx 2MB)</label><input type="file" accept="image/*"><div class="two"><div><label class="f">Color principal (lo que grita)</label><div class="row"><input type="color" name="color" value="${c.color}"><input value="${c.color}" readonly></div></div><div><label class="f">Color secundario</label><div class="row"><input type="color" name="color2" value="${c.color2||'#3f7d5a'}"><input value="${c.color2||'#3f7d5a'}" readonly></div></div></div><button class="btn fw mt">Guardar marca</button></form>
   <form class="card sec mt" data-form="pais"><h3 class="sh">País del club</h3><p class="mut sm">De acá salen la hora de los turnos y la moneda.</p><label class="f">País</label><select name="pais">${['Argentina','Bolivia','Chile','Colombia','Costa Rica','Ecuador','España','México','Paraguay','Perú','Uruguay'].map(x=>`<option ${x===c.pais?'selected':''}>${x}</option>`).join('')}</select><button class="btn fw mt">Guardar país</button></form>
   <form class="card sec mt" data-form="secciones"><h3 class="sh">Secciones del menú</h3><p class="mut sm">Mostrá sólo lo que usa tu club. Lo podés cambiar cuando quieras.</p><label class="chk"><input type="checkbox" name="buffetOn" ${c.buffetOn?'checked':''}>Buffet o kiosco</label><label class="chk"><input type="checkbox" name="torneosOn" ${c.torneosOn?'checked':''}>Torneos</label><button class="btn fw">Guardar secciones</button></form>`;
  if(t==='cobros')h+=`<form class="card sec" data-form="cobros"><h3 class="sh">Seña por transferencia</h3><p class="mut sm">El jugador ve tu alias, te transfiere y sube el comprobante. Vos lo validás desde el panel. La plata va directo a tu cuenta: la app no cobra nada por vos.</p><label class="chk"><input type="checkbox" name="senaOn" ${c.senaOn?'checked':''}>Pedir seña al reservar</label><label class="f">Monto de la seña</label><input name="monto" type="number" value="${c.senaMonto}" placeholder="8000"><label class="f">Alias o CBU para transferir</label><input name="alias" value="${esc(c.alias)}" placeholder="tuclub.padel"><button class="btn fw mt">Guardar pagos</button></form>`;
  if(t==='cancel')h+=`<form class="card sec" data-form="cancel"><h3 class="sh">Reglas de reserva</h3><p class="mut sm">Hasta cuándo puede cancelar un jugador desde el link, y qué se le pide la primera vez.</p><label class="f">Ventana de cancelación (horas antes del turno)</label><input name="horas" type="number" min="0" value="${c.cancelHoras}"><label class="chk"><input type="checkbox" name="pedirMail" ${c.pedirMail?'checked':''}>Pedir el mail la primera vez</label><p class="sm mut">Frena las reservas falsas: el que reserva por primera vez en tu club confirma su mail con un código, y hasta que juegue puede tener 2 turnos por delante. Los que ya jugaron en tu club no lo ven.</p><button class="btn fw">Guardar regla</button></form>`;
  if(t==='cuenta')h+=`<form class="card sec" data-form="pass"><h3 class="sh">Tu cuenta</h3><p class="mut sm">Cambiá la contraseña con la que entrás al panel.</p><label class="f">Contraseña actual</label><input type="password"><label class="f">Nueva contraseña</label><input type="password" placeholder="Mínimo 10 caracteres" minlength="10"><label class="f">Repetir la nueva</label><input type="password"><button class="btn fw mt">Cambiar contraseña</button></form><div class="card sec mt"><h3 class="sh">Notificaciones</h3><p class="mut sm">Enterate al instante cuando entra una reserva nueva, sin tener que estar mirando el panel.</p><button class="btn sec fw" data-act="push">Activar notificaciones</button></div>`;
  return h+'</div>'};
PANELS.plan=()=>{const n=activeCourts().length,pr=n*29666;let esc30=0;for(let i=1;i<=30;i++){const d=addDays(today(),-i);for(const c of activeCourts())for(const sl of slotsFor(c)){if(!bookingAt(c.id,d,sl,sl+c.dur))esc30+=priceFor(c.id,d,sl)}}
  const jug=S.bookings.filter(b=>b.estado==='jugada').length;
  return pageHead('Tu plan','Pagás siempre lo mismo por mes. El que reserva no paga ni un peso de más.')+`<div class="stats2"><div class="stat" style="border-color:#7a2e27"><span class="xs red">Se te escapó este mes en huecos</span><b>${money(esc30)}</b><span class="sm mut">Turnos que pasaron vacíos</span></div><div class="stat"><span class="xs">Turnos jugados</span><b>${jug}</b><span class="sm mut">En el mismo período</span></div><div class="stat"><span class="xs">Ocupación</span><b>${dayStats(today()).pct}%</b><span class="sm mut">Sobre lo ya transcurrido</span></div></div>
  <div class="card sec mt"><div class="row wrap"><h3 class="sh" style="margin:0">Plan por canchas</h3><span class="mut sm">${n} canchas activas</span></div><div class="mt"><span style="font-size:40px;font-weight:800">${money(pr)}</span><span class="mut"> /mes</span></div><p class="sm mut">Pagando cada 6 meses, 10% menos: ${money(pr*0.9)} por mes. Nunca te pedimos pagar un año adelantado. Los precios se actualizan cada 6 meses por inflación, avisando con un mes de anticipación.</p><div class="sub"><p class="sm" style="margin:0">Este mes se te escaparon <b>${money(esc30)}</b> en huecos. Si la app te llena ${money(pr)} de esos turnos al mes, ya se pagó sola.</p></div>
  <ul class="mut sm"><li>Tu propia página con tu nombre y tu color</li><li>Turnos ilimitados, sin doble reserva nunca</li><li>Caja, clientes y métricas</li><li>Lista de espera y recordatorios</li><li>Buffet, torneos y asistente</li></ul>
  <div class="sub"><div class="xs">Transferí a este alias</div><div class="row sp"><b style="font-size:20px">miplataforma.pagos</b><button class="btn sec sm" data-act="copy" data-v="miplataforma.pagos">Copiar</button></div><div class="mt">Importe: <b>${money(pr)}</b></div></div><button class="btn fw mt" data-act="demo" data-m="aviso de pago">Ya transferí, avisar</button><p class="sm mut mt" style="margin-bottom:0">Precios y alias de ejemplo: la maqueta no cobra nada.</p></div>`};
PANELS.equipo=()=>pageHead('Tu equipo','Sumá a quien te ayuda en el mostrador. Puede cargar turnos, aprobar señas, marcar jugado y anotar buffet — no puede ver ni cambiar tu plan, ni sumar o sacar gente.')+`<form class="card row wrap" data-form="team" style="max-width:560px"><div class="grow"><label class="f" style="margin-top:0">Mail de la persona</label><input name="mail" type="email" placeholder="nombre@mail.com" required></div><button class="btn">Sumar encargado</button></form><div class="col mt" style="max-width:560px">${S.team.map(m=>`<div class="card row sp"><b>${esc(m)}</b><button class="btn danger sm" data-act="teamDel" data-v="${esc(m)}">Quitar</button></div>`).join('')||'<div class="empty"><b>Todavía es sólo vos</b></div>'}</div>`;

/* ============ detalle de turno (panel) ============ */
function slotDialog(courtId,start){const c=court(courtId),d=ui.pdate;
  openModal(`<p class="xs">${longDate(d)}</p><h2 style="margin:0 0 12px">${esc(c.nombre)} · ${hhmm(start)}–${hhmm(start+c.dur)}</h2><div class="col"><button class="btn" data-act="cargar" data-court="${courtId}" data-start="${start}">Cargar turno</button><button class="btn sec" data-act="bloq" data-court="${courtId}" data-start="${start}">Bloquear horario</button></div>`)}
function cargarForm(courtId,start){const c=court(courtId);openModal(`<form data-form="cargar" data-court="${courtId}" data-start="${start}"><p class="xs">Cargar turno</p><h2 style="margin:0">${esc(c.nombre)} · ${hhmm(start)}–${hhmm(start+c.dur)}</h2><label class="f">Nombre</label><input name="nombre" list="cli" placeholder="Escribí y elegí, o cargá uno nuevo" required autocomplete="off"><datalist id="cli">${clients().map(x=>`<option value="${esc(x.nombre)}">`).join('')}</datalist><label class="f">WhatsApp (opcional)</label><input name="tel" placeholder="11 2345 6789" inputmode="tel"><label class="f">Precio</label><input name="precio" type="number" value="${priceFor(courtId,ui.pdate,start)}" required><label class="f">¿Ya pagó?</label><div class="seg"><button type="button" class="on" data-act="pagoTog" data-v="0">Debe</button><button type="button" data-act="pagoTog" data-v="1">Pagó</button></div><input type="hidden" name="pagado" value="0"><button class="btn block mt">Guardar turno</button></form>`)}
function bloqForm(courtId,start){const c=court(courtId);openModal(`<form data-form="bloq" data-court="${courtId}" data-start="${start}"><p class="xs">Bloquear horario</p><h2 style="margin:0">${esc(c.nombre)} · ${hhmm(start)}–${hhmm(start+c.dur)}</h2><p class="mut sm">El horario queda cerrado para reservas (lluvia, mantenimiento, torneo…).</p><label class="f">Motivo (opcional)</label><input name="motivo" placeholder="Lluvia"><button class="btn block mt">Bloquear horario</button></form>`)}
function bookingDialog(id,confirmar){const b=S.bookings.find(x=>x.id===id);if(!b)return;const c=court(b.courtId);
  if(b.tipo==='bloqueo')return openModal(`<p class="xs">Bloqueo</p><h2>${esc(c.nombre)} · ${hhmm(b.start)}–${hhmm(b.end)}</h2><p class="mut">${esc(b.motivo||'Sin motivo')}</p><button class="btn dng fw" data-act="unblock" data-id="${id}">Desbloquear horario</button>`);
  openModal(`<p class="xs" style="margin:0 0 4px">Detalle del turno</p><h2 style="margin:0 0 18px;font-size:23px">${esc(c.nombre)} · ${hhmm(b.start)}–${hhmm(b.end)}</h2><div style="font-size:23px;font-weight:700">${esc(b.nombre)}</div><p class="mut" style="margin:2px 0 8px">${esc(b.tel||'Sin teléfono')}${b.origen==='online'?' · reservó online':''}${b.sena&&!b.pagado?` · seña ${money(b.sena)}`:''}</p><div class="row" style="margin-bottom:16px"><span style="font-size:17px">${money(b.precio)}</span>${bookingChip(b)}${b.fijoId?'<span class="chip">fijo</span>':''}${b.busco?'<span class="chip">busca jugadores</span>':''}</div>
  <div class="col" style="gap:10px">${b.pagado?`<button class="btn sec" data-act="unpay" data-id="${id}">Marcar que debe</button><div class="seg"><button class="${b.metodo!=='transferencia'?'on':''}" data-act="pay" data-id="${id}" data-m="efectivo">Efectivo</button><button class="${b.metodo==='transferencia'?'on':''}" data-act="pay" data-id="${id}" data-m="transferencia">Transferencia</button></div>`:`<button class="btn" data-act="pay" data-id="${id}" data-m="efectivo">Marcar como pagado</button>`}
  <button class="btn sec" data-act="estado" data-id="${id}" data-v="jugada">Marcar como jugado</button><button class="btn dng" data-act="estado" data-id="${id}" data-v="noshow">No vino</button>
  ${b.estado==='jugada'||b.estado==='noshow'?`<button class="btn sec" data-act="estado" data-id="${id}" data-v="confirmada">Deshacer estado</button>`:''}
  ${confirmar?`<p class="mut sm" style="margin:2px 0">¿Cancelar? El horario vuelve a quedar libre.</p><div class="pair"><button class="btn sec" data-act="bkOpen" data-id="${id}">No</button><button class="btn dng" data-act="cancelBk" data-id="${id}">Sí, dale</button></div>`:`<button class="btn dng" data-act="cancelAsk" data-id="${id}">Cancelar turno</button>`}
  <div class="acts" style="justify-content:center">${b.tel?`<a class="btn sec sm" target="_blank" href="${wa(b.tel,'Hola '+b.nombre.split(' ')[0]+'!')}">WhatsApp</a>`:''}<button class="btn sec sm" data-act="mover" data-id="${id}">Mover</button><button class="btn sec sm" data-act="precio" data-id="${id}">Cambiar precio</button></div></div>`)}
/* ============ acciones (click) ============ */
const ACT={
 mbg:(d,el,e)=>{if(e.target===el)closeModal()},mclose:()=>closeModal(),menu:()=>{ui.menu=!ui.menu;render()},
 hideBanner:()=>{ui.hideBanner=1;render()},
 logout:()=>{S.session.role=null;save()},

 wizSport:d=>{wizSync();const w=S.wiz,i=w.deportes.indexOf(d.s);if(i<0)w.deportes.push(d.s);else w.deportes.splice(i,1);ui.werr='';save();render()},
 wizCnt:d=>{wizSync();const w=S.wiz;w.canchas[d.s]=Math.min(20,Math.max(1,(w.canchas[d.s]||1)+ +d.d));save();render()},

 wizGo:d=>{wizSync();S.wiz.step=+d.i;S.wiz.back=true;ui.werr='';save();render()},
 share:()=>{S.sharedOnce=1;save();const u=location.origin+location.pathname+'#/c/'+S.club.slug;navigator.clipboard?.writeText(u).catch(()=>{});toast('Link copiado: '+u)},
 copy:(d)=>{navigator.clipboard?.writeText(d.v).catch(()=>{});toast('Copiado')},
 forgot:()=>toast('Te mandamos un mail para cambiar la contraseña (simulado)'),
 demo:(d)=>toast('Exportar a '+d.m+' (simulado en la maqueta)'),push:()=>toast('Notificaciones activadas (simulado)'),
 /* cliente */
 cday:d=>{ui.cdate=d.d;render()},ctab:d=>{ui.ctab=d.t;render()},ccourt:d=>{ui.ccourt=+d.id;render()},

 waitlist:d=>{const p=S.session.role==='player'?S.player:(S.guest||{});openModal(`<form data-form="wait" data-court="${d.court}" data-start="${d.start}"><h1>Ese turno está ocupado</h1><p class="mut">Anotate y te avisamos si se libera. Lo toma el primero que reserve.</p><label class="f">Tu nombre</label><input name="nombre" value="${esc(p.nombre||'')}" required><label class="f">Tu WhatsApp</label><input name="tel" value="${esc(p.tel||'')}" required><button class="btn block mt">Anotarme en la lista de espera</button></form>`)},
 sena:d=>senaSheet(+d.id),
 cancelMine:d=>{if(confirm('¿Cancelar este turno?')){cancelBooking(+d.id,'jugador');toast('Turno cancelado');render()}},
 noCancel:()=>toast('Ya no se puede cancelar desde acá. Llamá al club.'),
 ask:d=>{ui.chat.push({me:true,t:d.q},{me:false,t:answerClub(d.q)});render()},
 sumarse:d=>{const b=S.bookings.find(x=>x.id===+d.id);openModal(`<form data-form="sumarse" data-id="${d.id}"><h1>Pedir sumarte</h1><p class="mut">${shortDate(b.date)} · ${hhmm(b.start)} · ${esc(court(b.courtId).nombre)}</p><label class="f">Tu nombre</label><input name="nombre" value="${esc(S.player.nombre)}" required><label class="f">Mensaje</label><input name="msg" placeholder="Juego de 6ta, ¿puedo?"><button class="btn block mt">Enviar solicitud</button></form>`)},
 reqOk:d=>{const r=S.requests.find(x=>x.id===+d.id);r.estado='aceptada';const b=S.bookings.find(x=>x.id===r.bookingId);b.busco.cupo--;if(b.busco.cupo<=0)b.busco=null;save();toast('Solicitud aceptada');render()},

 readN:()=>{S.notifs.forEach(n=>n.leida=true);save();render()},
 busco:d=>{const b=S.bookings.find(x=>x.id===+d.id);openModal(`<form data-form="busco" data-id="${d.id}"><h1>Busco jugadores</h1><p class="mut">Tu turno aparece en el link del club para que otros pidan sumarse.</p><label class="f">¿Cuántos faltan?</label><input name="cupo" type="number" min="1" max="4" value="${b.busco?.cupo||1}"><label class="f">Categoría</label><input name="cat" value="${esc(b.busco?.cat||'')}" placeholder="6ta-7ma"><button class="btn block mt">Publicar</button>${b.busco?'<button type="button" class="btn danger block mt" data-act="buscoOff" data-id="'+d.id+'">Dejar de buscar</button>':''}</form>`)},
 buscoOff:d=>{S.bookings.find(x=>x.id===+d.id).busco=null;save();closeModal();render()},
 verifMail:()=>{const code=prompt('Te mandamos un código al mail (simulado). Ingresá 123456:');if(code==='123456'){S.player.mailOk=true;save();toast('Mail verificado');render()}else if(code!==null)toast('Código incorrecto')},
 canje:d=>{const r=S.rewards.find(x=>x.id===+d.id);if(S.player.puntos<r.puntos)return;S.player.puntos-=r.puntos;S.redemptions.push({id:S.seq++,rewardId:r.id,nombre:r.nombre,userId:S.player.id,estado:'pendiente'});save();toast('Canje pedido: retiralo en el club');render()},
 /* panel */
 pdate:d=>{ui[d.k]=d.d;render()},pcourt:d=>{ui.pcourt=d.id;render()},
 slot:d=>{if(isPast(ui.pdate,+d.start)&&!confirm('Este horario ya pasó. ¿Cargar igual?'))return;slotDialog(+d.court,+d.start)},

 pagoTog:(d,el)=>{el.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));el.classList.add('on');el.closest('form').pagado.value=d.v},
 unblock:d=>{S.bookings=S.bookings.filter(b=>b.id!==+d.id);save();closeModal();render()},
 pay:d=>{const b=S.bookings.find(x=>x.id===+d.id);b.pagado=true;b.metodo=d.m;save();bookingDialog(b.id);render()},
 unpay:d=>{const b=S.bookings.find(x=>x.id===+d.id);b.pagado=false;b.metodo=null;save();bookingDialog(b.id);render()},
 estado:d=>{const b=S.bookings.find(x=>x.id===+d.id);const was=b.estado;b.estado=d.v;
   if(d.v==='jugada'&&was!=='jugada'&&S.club.puntos&&b.userId===S.player.id){S.player.puntos+=S.club.ptsPorTurno;toast('Sumó '+S.club.ptsPorTurno+' puntos al jugador')}
   if(was==='jugada'&&d.v!=='jugada'&&S.club.puntos&&b.userId===S.player.id)S.player.puntos=Math.max(0,S.player.puntos-S.club.ptsPorTurno);
   save();bookingDialog(b.id);render()},
 cancelBk:d=>{if(confirm('¿Cancelar este turno? Se avisa a la lista de espera.')){const b=S.bookings.find(x=>x.id===+d.id);cancelBooking(b.id);S.waitlist.filter(w=>w.estado==='avisado'&&w.courtId===b.courtId&&w.date===b.date&&w.start===b.start).length&&toast('Se avisó a la lista de espera');closeModal();render()}},
 precio:d=>{const b=S.bookings.find(x=>x.id===+d.id);const v=prompt('Nuevo precio',b.precio);if(v!==null&&!isNaN(+v)){b.precio=+v;save();bookingDialog(b.id);render()}},
 mover:d=>{const b=S.bookings.find(x=>x.id===+d.id);const opts=freeSlots(b.date).filter(x=>x.c.dur===court(b.courtId).dur);openModal(`<form data-form="mover" data-id="${b.id}"><h2>Mover turno</h2><p class="mut sm">Solo muestra horarios libres del mismo día y misma duración.</p><label class="f">Nuevo horario</label><select name="to">${opts.map(o=>`<option value="${o.c.id}|${o.s}">${hhmm(o.s)} · ${esc(o.c.nombre)}</option>`).join('')||'<option value="">No hay horarios libres</option>'}</select><button class="btn block mt" ${opts.length?'':'disabled'}>Mover</button></form>`)},
 rtab:d=>{ui.rtab=d.v;render()},rfil:d=>{ui.rfil=d.v;render()},rec:d=>{ui.rec=d.v;render()},
 sent:d=>{S.sent[d.id]=1;save();setTimeout(render,300)},
 cerrar:d=>{S.cierres[d.d]={hora:hhmm(nowMin()),total:+d.t};save();toast('Caja cerrada');render()},reabrir:d=>{delete S.cierres[d.d];save();render()},
 buftab:d=>{ui.bufTab=d.v;render()},cartAdd:d=>{ui.cart[d.id]=(ui.cart[d.id]||0)+1;render()},cartDel:d=>{ui.cart[d.id]=Math.max(0,(ui.cart[d.id]||0)-1);render()},
 cobrarBuf:d=>{sellBuf(d.m)},
 cargarCancha:()=>{const bs=dayBookings(today()).filter(b=>b.tipo==='reserva');openModal(`<form data-form="bufCancha"><h2>Cargar a una cancha</h2><p class="mut sm">El consumo se suma al turno y se cobra todo junto.</p><select name="b">${bs.map(b=>`<option value="${b.id}">${hhmm(b.start)} · ${esc(court(b.courtId).nombre)} · ${esc(b.nombre)}</option>`).join('')}</select><button class="btn block mt">Cargar</button></form>`)},
 prodEdit:d=>{const p=d.id?S.products.find(x=>x.id===+d.id):{nombre:'',precio:'',stock:''};openModal(`<form data-form="prod" data-id="${d.id||''}"><h2>${d.id?'Editar':'Nuevo'} producto</h2><label class="f">Nombre</label><input name="nombre" value="${esc(p.nombre)}" required><label class="f">Precio</label><input name="precio" type="number" value="${p.precio}" required><label class="f">Stock</label><input name="stock" type="number" value="${p.stock}" required><button class="btn block mt">Guardar</button></form>`)},

 wdel:d=>{S.waitlist=S.waitlist.filter(w=>w.id!==+d.id);save();render()},
 cctab:d=>{ui.ccTab=d.v;render()},courtNew:()=>courtAddForm(),
 prDel:d=>{S.pricing=S.pricing.filter(r=>r.id!==+d.id);save();render()},fcourt:d=>{if(d.id!=='undefined'){ui.fcourt=+d.id;render()}},
 fijo:d=>{const c=+d.court,w=+d.dow,s=+d.start,f=S.fijos.find(x=>x.courtId===c&&x.dow===w&&x.start===s);openModal(`<form data-form="fijo" data-court="${c}" data-dow="${w}" data-start="${s}"><p class="xs">Turno fijo</p><h2 style="margin:0">${DIASF[w]} ${hhmm(s)} · ${esc(court(c).nombre)}</h2><label class="f">Nombre</label><input name="nombre" value="${esc(f?.nombre||'')}" required><label class="f">WhatsApp</label><input name="tel" value="${esc(f?.tel||'')}"><label class="f">Precio</label><input name="precio" type="number" value="${f?.precio||priceFor(c,addDays(today(),(w-dow(today())+7)%7),s)}"><button class="btn block mt">Guardar fijo</button>${f?`<button type="button" class="btn danger block mt" data-act="fijoDel" data-id="${f.id}">Quitar fijo</button>`:''}</form>`)},
 fijoDel:d=>{S.fijos=S.fijos.filter(f=>f.id!==+d.id);S.bookings.filter(b=>b.fijoId===+d.id&&b.date>=today()).forEach(b=>b.estado='cancelada');save();closeModal();render()},

 met:d=>{ui.met=d.v;render()},cfgtab:d=>{ui.cfgTab=d.v;render()},
 torNew:()=>openModal(`<form data-form="torNew"><h2>Nuevo torneo</h2><label class="f">Nombre</label><input name="nombre" required><label class="f">Deporte</label><select name="deporte"><option>Pádel</option><option>Fútbol</option><option>Tenis</option></select><label class="f">Fecha</label><input type="date" name="fecha" value="${addDays(today(),14)}"><label class="f">Inscripción</label><input name="precio" type="number" value="20000"><label class="f">Cupo</label><input name="cupo" type="number" value="16"><button class="btn block mt">Crear torneo</button></form>`),

 demoOpen:()=>demoDialog(),more:()=>moreSheet(),pushOff:()=>{ui.pushOff=1;render()},
 bell:d=>{const pl=d.r==='player';const l=S.notifs.filter(n=>pl?n.para==='player':n.para!=='player');openModal(`<div class="row sp"><h2 style="margin:0">Avisos</h2><button class="btn sec sm" data-act="mclose">✕</button></div><div class="col mt">${l.map(n=>`<div class="card sm" style="${n.leida?'opacity:.6':''}">${esc(n.txt)}<div class="xs" style="margin-top:4px">${new Date(n.t).toLocaleString('es-AR')}</div></div>`).join('')||'<div class="empty">No tenés avisos todavía.</div>'}</div>`);l.forEach(n=>n.leida=true);save()},

 prodLista:()=>{[['Agua','Bebidas',1800,900],['Gaseosa','Bebidas',2500,1300],['Cerveza','Bebidas',4500,2500],['Gatorade','Bebidas',3500,2000],['Pelotas x3','Accesorios',12000,8000]].forEach(([n,t,p,c])=>{if(!S.products.some(x=>x.nombre===n))S.products.push({id:S.seq++,nombre:n,tipo:t,precio:p,costo:c,stock:'',avisar:''})});save();toast('Productos cargados');render()},
 prodEdit:d=>{const p=d.id?S.products.find(x=>x.id===+d.id):{nombre:'',tipo:'Bebidas',precio:'',costo:'',stock:'',avisar:''};openModal(`<form data-form="prod" data-id="${d.id||''}"><h2>${d.id?'Editar':'Nuevo'} producto</h2><label class="f">Qué es</label><input name="nombre" value="${esc(p.nombre)}" required><label class="f">Qué tipo</label><select name="tipo">${['Bebidas','Comida','Accesorios','Otro'].map(x=>`<option ${x===p.tipo?'selected':''}>${x}</option>`).join('')}</select><label class="f">A cuánto lo vendés</label><input name="precio" type="number" value="${p.precio}" required><label class="f">A cuánto lo comprás</label><input name="costo" type="number" value="${p.costo??''}"><label class="f">Cuántos tenés (vacío = no lo contás)</label><input name="stock" type="number" value="${p.stock??''}"><label class="f">Avisame cuando queden</label><input name="avisar" type="number" value="${p.avisar??''}"><button class="btn fw mt">Guardar</button><button type="button" class="btn sec fw mt" data-act="mclose">Cancelar</button></form>`)},
 rewEdit:d=>{const r=d.id?S.rewards.find(x=>x.id===+d.id):{nombre:'',desc:'',puntos:100,stock:'',activo:true};openModal(`<form data-form="rew" data-id="${d.id||''}"><p class="xs">${d.id?'Editar':'Nuevo'} premio</p><label class="f">Nombre</label><input name="nombre" value="${esc(r.nombre)}" placeholder="1 turno gratis" required><label class="f">Descripción</label><input name="desc" value="${esc(r.desc||'')}" placeholder="Canjeá por un turno sin cargo"><label class="f">Puntos que cuesta</label><input name="puntos" type="number" value="${r.puntos}" required><label class="f">Stock</label><input name="stock" type="number" value="${r.stock??''}" placeholder="Vacío = ilimitado"><label class="chk"><input type="checkbox" name="activo" ${r.activo?'checked':''}>Activo (los jugadores lo ven)</label><button class="btn fw">${d.id?'Guardar':'Crear premio'}</button><button type="button" class="btn sec fw mt" data-act="mclose">Cancelar</button></form>`)},
 torNew:()=>openModal(`<form data-form="torNew"><p class="xs">Nuevo torneo</p><label class="f">Nombre</label><input name="nombre" placeholder="Suma 12" required><label class="f">Deporte</label><select name="deporte"><option>Pádel</option><option>Fútbol</option><option>Tenis</option></select><p class="sm mut" style="margin:6px 0 0">Se carga por sets y no admite empates.</p><label class="f">Formato</label><select name="formato"><option>Grupos</option><option>Eliminación directa</option><option>Todos contra todos</option></select><label class="f">Cupo</label><input name="cupo" type="number" placeholder="Vacío = sin límite"><label class="f">Valor de la inscripción</label><input name="precio" type="number" placeholder="Vacío = gratis"><label class="f">Desde</label><input type="date" name="desde" value="${addDays(today(),14)}"><label class="f">Hasta</label><input type="date" name="hasta" value="${addDays(today(),15)}"><button class="btn fw mt">Crear torneo</button><button type="button" class="btn sec fw mt" data-act="mclose">Cancelar</button></form>`),
});
function sellBuf(m,booking){const items=Object.entries(ui.cart).filter(([,q])=>q>0);let total=0,txt=[];items.forEach(([id,q])=>{const p=S.products.find(x=>x.id==id);if(p.stock!==''&&p.stock!=null)p.stock=Math.max(0,p.stock-q);total+=p.precio*q;txt.push(q+' '+p.nombre)});
  if(booking){const b=S.bookings.find(x=>x.id===+booking);b.precio+=total;txt.push('(cargado a '+b.nombre+')')}else S.sales.push({id:S.seq++,date:today(),items:txt.join(', '),total,metodo:m});
  ui.cart={};save();closeModal();toast(booking?'Consumo cargado al turno':'Venta cobrada: '+money(total));render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(!f)return;if(el.tagName==='A'&&el.dataset.act==='logout'){}f(el.dataset,el,e)});
document.addEventListener('change',e=>{const k=e.target.dataset.chk;if(k){ui[k]=e.target.checked;render()}});
document.addEventListener('input',e=>{if(e.target.dataset.input==='q'){ui.q=e.target.value;render()}});
document.addEventListener('input',e=>{const k=e.target.dataset.input;if(!k||!S.wiz)return;
  if(k==='cname'){S.wiz.name=e.target.value;if(!S.wiz.slugEdit)S.wiz.slug=slug(e.target.value).slice(0,30);showSlug()}
  else if(k==='cslug'){const v=e.target.value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9-]+/g,'-').replace(/-{2,}/g,'-');if(v!==e.target.value)e.target.value=v;S.wiz.slug=v;showSlug()}
  else if(k==='wprice'){e.target.value=e.target.value.replace(/\D/g,'');const st=wizSteps()[S.wiz.step];if(st&&st.s){const p=wprice(st.s);p.precio=e.target.value;const el=document.getElementById('wpreview');if(el)el.textContent=p.precio?`Un turno de ${p.dur} minutos: ${money(+p.precio)}`:''}}});

/* ============ formularios ============ */
const fnum=v=>Number(v)||0;
const FORM={
 ownerLogin:f=>{S.owner.mail=f.mail;S.session.role='owner';save();location.hash='#/panel/agenda';render()},
 ownerReg:(f,form)=>{const err=m=>{const e=form.querySelector('[data-err]');e.textContent=m;e.hidden=false};const mail=f.mail.trim().toLowerCase();
   if(TAKEN_MAILS.includes(mail))return err('Ya hay una cuenta con ese mail. Entrá con tu contraseña.');
   if(f.pass.length<10)return err('La contraseña tiene que tener al menos 10 caracteres.');
   if(WEAK_PASS.includes(f.pass.toLowerCase()))return err('Esa contraseña aparece en listas de contraseñas filtradas. Elegí otra.');
   S=blank(mail);S.wiz=wizInit();ui.chat=[];ui.aichat=[];ui.ccourt=null;ui.werr='';save();location.hash='#/panel/empezar';render()},
 wizClub2:f=>{const w=S.wiz,name=f.name.trim(),sl=slug(w.slugEdit&&f.slug?f.slug:name).slice(0,30);w.name=name;w.slug=sl;if(name.length<2){ui.werr='Poné el nombre del club.';render();return}const m=slugCheck(sl);if(m){ui.werr=m;render();return}ui.werr='';w.step=3;save();render()},
 wizClub3:f=>{const w=S.wiz,ph=(f.phone||'').replace(/\D/g,'');w.phone=f.phone||'';if(f.phone&&ph.length<8){ui.werr='Revisá el número: parece corto.';render();return}ui.werr='';Object.assign(S.club,{name:w.name,slug:w.slug,phone:w.phone,created:true});w.phase='setup';w.step=0;w.back=false;save();render();window.scrollTo(0,0);toast('Tu club ya tiene link: concancha.com.ar/'+w.slug)},
 wizStep:()=>wizNext(),
 playerLogin:f=>{S.player.mail=f.mail;S.session.role='player';save();location.hash='#/jugador';render()},
 ask:(f)=>{if(!f.q.trim())return;ACT.ask({q:f.q.trim()})},aask:f=>{if(!f.q.trim())return;ACT.aask({q:f.q.trim()})},
 reservar:(f,form)=>{const court_=+form.dataset.court,s=+form.dataset.start,c=court(court_),d=ui.cdate;
   if(bookingAt(court_,d,s,s+c.dur)){toast('Ese turno se acaba de ocupar');closeModal();render();return}
   const logged=S.session.role==='player';const mine=myBookings().length;
   if(S.club.pedirMail&&f.mail&&!(logged&&S.player.mailOk)&&mine>=2){toast('Con tu primer turno podés tener hasta 2 por delante. Jugá uno primero.');return}
   const b=addBooking({courtId:court_,date:d,start:s,end:s+c.dur,nombre:f.nombre,tel:f.tel,precio:priceFor(court_,d,s),origen:'online',userId:logged?S.player.id:undefined,estado:S.club.senaOn?'pendiente_sena':'confirmada'});
   if(!logged)S.guest={nombre:f.nombre,tel:f.tel,mail:f.mail};save();closeModal();notify('Reserva nueva online: '+f.nombre+' '+hhmm(s));
   if(S.club.senaOn){senaSheet(b.id)}else doneSheet(b,'¡Turno reservado!');render()},
 sena:(f,form)=>{const b=S.bookings.find(x=>x.id===+form.dataset.id);if(!S.payments.some(p=>p.bookingId===b.id&&p.estado==='pendiente'))S.payments.push({id:S.seq++,bookingId:b.id,monto:S.club.senaMonto,estado:'pendiente',nombre:b.nombre,creado:today()});save();closeModal();doneSheet(b,'Comprobante enviado');$('#modal .modal p').textContent='El club lo revisa y te confirma el turno. ('+shortDate(b.date)+' · '+hhmm(b.start)+')';render()},
 wait:(f,form)=>{S.waitlist.push({id:S.seq++,nombre:f.nombre,tel:f.tel,courtId:+form.dataset.court,date:ui.cdate,start:+form.dataset.start,estado:'esperando'});save();closeModal();toast('Listo, te avisamos si se libera');render()},
 sumarse:(f,form)=>{S.requests.push({id:S.seq++,bookingId:+form.dataset.id,nombre:f.nombre,msg:f.msg,estado:'pendiente'});save();closeModal();toast('Solicitud enviada');render()},
 busco:(f,form)=>{S.bookings.find(x=>x.id===+form.dataset.id).busco={cupo:fnum(f.cupo),cat:f.cat};save();closeModal();render()},
 perfil:f=>{Object.assign(S.player,{nombre:f.nombre,tel:f.tel,mail:f.mail});save();toast('Guardado');render()},
 cargar:(f,form)=>{const c_=+form.dataset.court,s=+form.dataset.start,c=court(c_);if(bookingAt(c_,ui.pdate,s,s+c.dur)){toast('Ese horario ya está ocupado');return}
   addBooking({courtId:c_,date:ui.pdate,start:s,end:s+c.dur,nombre:f.nombre,tel:f.tel,precio:fnum(f.precio),pagado:f.pagado==='1',metodo:f.pagado==='1'?'efectivo':null});closeModal();toast('Turno guardado');render()},
 bloq:(f,form)=>{const c_=+form.dataset.court,s=+form.dataset.start,c=court(c_);addBooking({courtId:c_,date:ui.pdate,start:s,end:s+c.dur,tipo:'bloqueo',nombre:'Bloqueo',motivo:f.motivo,precio:0});closeModal();render()},
 mover:(f,form)=>{if(!f.to)return;const b=S.bookings.find(x=>x.id===+form.dataset.id);const [c,s]=f.to.split('|').map(Number);b.courtId=c;b.start=s;b.end=s+court(c).dur;save();closeModal();toast('Turno movido');render()},
 bufCancha:f=>sellBuf(null,f.b),
 prod:(f,form)=>{const id=form.dataset.id;if(id){Object.assign(S.products.find(p=>p.id===+id),{nombre:f.nombre,precio:fnum(f.precio),stock:fnum(f.stock)})}else S.products.push({id:S.seq++,nombre:f.nombre,precio:fnum(f.precio),stock:fnum(f.stock)});save();closeModal();render()},
 courtAdd:f=>{const id=S.seq++;S.courts.push({id,nombre:f.nombre.trim()||'Cancha',deporte:f.deporte,dur:fnum(f.dur)||90,activa:true});S.pricing.push({id:S.seq++,courtId:id,dias:null,desde:S.club.apertura??480,hasta:S.club.cierre??1440,precio:fnum(f.precio)});save();closeModal();toast('Cancha agregada');ui.ccTab='precios';render()},
 court:(f,form)=>{const d=f.desde===''?null:+f.desde,h=f.hasta===''?null:+f.hasta;if((d??S.club.apertura)>=(h??S.club.cierre)){toast('Tiene que cerrar después de abrir');return}Object.assign(court(+form.dataset.id),{nombre:f.nombre,deporte:f.deporte,dur:fnum(f.dur)||90,activa:!!f.activa,desde:d,hasta:h});save();toast('Cancha guardada');render()},
 clubHours:f=>{const d=+f.desde,h=+f.hasta;if(h<=d){toast('Tiene que cerrar después de abrir');return}S.club.apertura=d;S.club.cierre=h;save();toast('Horario guardado');render()},
 pricing:f=>{if(!f.courtId){toast('Elegí una cancha');return}const desde=mins(f.desde),hasta=f.hasta==='23:59'?1440:mins(f.hasta);if(hasta<=desde){toast('“Hasta” tiene que ser después de “Desde”');return}S.pricing.push({id:S.seq++,courtId:+f.courtId,dias:f.dias===''?null:f.dias.split(',').map(Number),desde,hasta,precio:fnum(f.precio)});save();render()},
 fijo:(f,form)=>{const c=+form.dataset.court,w=+form.dataset.dow,s=+form.dataset.start,cc=court(c);let fx=S.fijos.find(x=>x.courtId===c&&x.dow===w&&x.start===s);
   if(fx){S.bookings.filter(b=>b.fijoId===fx.id&&b.date>=today()).forEach(b=>b.estado='cancelada');Object.assign(fx,{nombre:f.nombre,tel:f.tel,precio:fnum(f.precio)})}else{fx={id:S.seq++,courtId:c,dow:w,start:s,nombre:f.nombre,tel:f.tel,precio:fnum(f.precio)};S.fijos.push(fx)}
   let n=0;for(let i=0;i<84;i++){const d=addDays(today(),i);if(dow(d)!==w)continue;if(bookingAt(c,d,s,s+cc.dur))continue;addBooking({courtId:c,date:d,start:s,end:s+cc.dur,nombre:fx.nombre,tel:fx.tel,precio:fx.precio,fijoId:fx.id});n++}save();closeModal();toast('Fijo guardado: '+n+' turnos agendados');render()},
 puntos:f=>{S.club.puntos=!!f.puntos;S.club.ptsPorTurno=fnum(f.pts)||10;save();toast('Regla guardada')},
 torNew:f=>{S.tournaments.push({id:S.seq++,nombre:f.nombre,deporte:f.deporte,fecha:f.fecha,precio:fnum(f.precio),cupo:fnum(f.cupo),estado:'abierto',entries:[]});save();closeModal();render()},
 torAdd:(f,form)=>{const t=S.tournaments.find(x=>x.id===+form.dataset.id);if(t.entries.length>=t.cupo){toast('Cupo completo');return}t.entries.push({id:S.seq++,nombre:f.nombre,pagado:false});save();closeModal();render()},
 rew:(f,form)=>{const o={nombre:f.nombre,puntos:fnum(f.puntos),activo:!!f.activo};if(form.dataset.id)Object.assign(S.rewards.find(r=>r.id===+form.dataset.id),o);else S.rewards.push({id:S.seq++,...o});save();closeModal();render()},
 marca:f=>{S.club.name=f.name;S.club.phone=f.phone;S.club.color=f.color;save();toast('Marca guardada');render()},
 secciones:f=>{S.club.buffetOn=!!f.buffetOn;S.club.torneosOn=!!f.torneosOn;save();toast('Menú actualizado');render()},
 cobros:f=>{S.club.senaOn=!!f.senaOn;S.club.senaMonto=fnum(f.monto);S.club.alias=f.alias;save();toast('Cobros guardados')},
 cancel:f=>{S.club.cancelHoras=fnum(f.horas);S.club.pedirMail=!!f.pedirMail;save();toast('Regla guardada')},
 pass:()=>toast('Contraseña cambiada (simulado)'),
 team:f=>{S.team.push(f.mail);save();render()},
};
Object.assign(FORM,{
 prod:(f,form)=>{const o={nombre:f.nombre,tipo:f.tipo,precio:fnum(f.precio),costo:f.costo===''?'':fnum(f.costo),stock:f.stock===''?'':fnum(f.stock),avisar:f.avisar===''?'':fnum(f.avisar)};const id=form.dataset.id;if(id)Object.assign(S.products.find(p=>p.id===+id),o);else S.products.push({id:S.seq++,...o});save();closeModal();render()},
 prodNew:(f,form)=>{S.products.push({id:S.seq++,nombre:f.nombre,tipo:f.tipo,precio:fnum(f.precio),costo:f.costo===''?'':fnum(f.costo),stock:f.stock===''?'':fnum(f.stock),avisar:f.avisar===''?'':fnum(f.avisar)});save();toast('Producto agregado');render()},
 rew:(f,form)=>{const o={nombre:f.nombre,desc:f.desc,puntos:fnum(f.puntos),stock:f.stock===''?'':fnum(f.stock),activo:!!f.activo};if(form.dataset.id)Object.assign(S.rewards.find(r=>r.id===+form.dataset.id),o);else S.rewards.push({id:S.seq++,...o});save();closeModal();toast('Premio guardado');render()},
 torNew:f=>{S.tournaments.push({id:S.seq++,nombre:f.nombre,deporte:f.deporte,formato:f.formato,desde:f.desde,hasta:f.hasta,precio:f.precio===''?0:fnum(f.precio),cupo:f.cupo===''?0:fnum(f.cupo),estado:'abierto',entries:[]});save();closeModal();render()},
 torAdd:(f,form)=>{const t=S.tournaments.find(x=>x.id===+form.dataset.id);if(t.cupo&&t.entries.length>=t.cupo){toast('Cupo completo');return}t.entries.push({id:S.seq++,nombre:f.nombre,pagado:false});save();closeModal();render()},
 perfil:f=>{Object.assign(S.player,{nombre:f.nombre,tel:f.tel,backup:f.backup,categoria:f.cat});save();toast('Guardado');render()},
 marca:f=>{S.club.name=f.name;S.club.phone=f.phone;S.club.color=f.color;S.club.color2=f.color2;save();toast('Marca guardada');render()},
 pais:f=>{S.club.pais=f.pais;save();toast('País guardado')},
});
document.addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const fn=FORM[form.dataset.form];if(fn)fn(Object.fromEntries(new FormData(form)),form)});

/* ============ demo ============ */
function demoDialog(){openModal(`<h2>Controles de la maqueta</h2><div class="col"><div><label class="f" style="margin-top:0">Hora simulada de “ahora” (para ver “Pasó” y “Se escapa”)</label><input type="time" id="simnow" value="${S.simNow}"></div><div class="two"><a class="btn sec" href="#/" data-act="mclose">Inicio</a><a class="btn sec" href="#/c/${S.club.slug}" data-act="mclose">Sitio jugador</a><a class="btn sec" href="#/panel/agenda" data-act="mclose">Panel club</a><a class="btn sec" href="#/jugador" data-act="mclose">Cuenta jugador</a></div><button class="btn danger" id="reset">Reiniciar datos de ejemplo</button><button class="btn sec" data-act="mclose">Cerrar</button></div>`);
  $('#simnow').onchange=e=>{S.simNow=e.target.value||'14:00';save();render()};$('#reset').onclick=()=>{if(confirm('Se borran los cambios que hiciste.')){localStorage.removeItem(LS);S=seed();ui.chat=[];ui.aichat=[];closeModal();location.hash='#/';render()}}}
$('#fab').onclick=demoDialog;
render();
</script>
